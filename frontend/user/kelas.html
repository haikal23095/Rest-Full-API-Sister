<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SD Permata Indah - Daftar Kelas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert("Anda belum login!");
      window.location.href = 'login.html';
    }
  </script>

  <style>
    /* STYLE SAMA SEPERTI SEBELUMNYA */
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6f7;
    }

    .header-top {
      background-color: #00498C;
      padding: 20px 40px;
      display: flex;
      align-items: center;
    }

    .header-logo {
      height: 85px;
    }

    .header-title {
      color: white;
      font-size: 36px;
      font-weight: 700;
      margin-left: 20px;
      letter-spacing: 1px;
    }

    .menu-bar {
      background-color: #0A64C3;
      padding: 12px 40px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .menu-bar a {
      color: white;
      text-decoration: none;
    }

    .menu-bar a:hover {
      color: #dfefff;
      text-decoration: underline;
    }

    .menu-right {
      margin-left: auto;
      cursor: pointer;
    }

    .dropdown-menu {
      background-color: #ffffff !important;
    }

    .dropdown-item {
      color: #000 !important;
      font-weight: 600;
    }

    .dropdown-item:hover {
      background-color: #0A64C3 !important;
      color: #fff !important;
    }

    .container-main {
      padding: 22px;
    }

    .page-title {
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 14px;
    }

    .filter-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .oval-select {
      border-radius: 30px;
      padding: 8px 14px;
      border: 1.5px solid #cfcfcf;
      background: white;
      min-width: 220px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.02);
      appearance: none;
    }

    .oval-select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(17, 84, 128, 0.08);
      border-color: #8fb0d9;
    }

    .btn-search {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      cursor: pointer;
    }

    .btn-search:hover {
      transform: translateY(-2px);
    }

    .section-title {
      text-align: center;
      font-weight: 800;
      margin: 28px 0 18px;
      font-size: 18px;
    }

    .wali-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-bottom: 40px;
    }

    .wali-card {
      background: white;
      border-radius: 12px;
      width: 520px;
      padding: 18px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .wali-card.small {
      width: 420px;
    }

    .photo {
      width: 84px;
      height: 100px;
      background: #f0f0f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }

    .bio {
      font-size: 14px;
      color: #222;
    }

    .bio strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .bottom-grid {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {

      .wali-card,
      .wali-card.small {
        width: 92%;
      }

      .oval-select {
        min-width: 160px;
      }

      .bottom-grid {
        flex-direction: column;
        gap: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="header-top">
    <img src="logo.png" class="header-logo" alt="Logo" onerror="this.style.display='none'">
    <div class="header-title">SD PERMATA INDAH</div>
  </div>

  <div class="menu-bar">
    <a href="beranda.html">BERANDA</a>

    <div class="dropdown d-inline">
      <a class="dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
        style="color:white; text-decoration:none;">
        PROFIL
      </a>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="profilguru.html">GURU</a></li>
        <li><a class="dropdown-item" href="profilsiswa.html">SISWA</a></li>
      </ul>
    </div>

    <a href="kelas.html">KELAS</a>
    <a href="jadwal.html">JADWAL</a>

    <div class="menu-right dropdown">
      <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown" style="text-decoration: none; color: white;">
        <i class="bi bi-person-circle" style="font-size: 28px;"></i>
        <span id="username-display" style="font-size: 14px; margin-left: 5px;">Hi, User</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item text-danger" href="#" onclick="handleLogout()">Logout</a></li>
      </ul>
    </div>
  </div>

  <div class="container container-main">

    <div class="page-title">DAFTAR KELAS & WALI KELAS</div>

    <div class="filter-area">
      <select id="kelasSelect" class="oval-select">
        <option value="" selected>SEMUA KELAS</option>
      </select>

      <select id="subjectSelect" class="oval-select">
        <option value="" selected>SEMUA MATA PELAJARAN</option>
      </select>

      <button id="searchBtn" class="btn-search" title="Search" onclick="handleSearch()">
        <i class="bi bi-search" style="font-size:18px;"></i>
      </button>
    </div>

    <div class="section-title">WALI KELAS</div>

    <div id="waliContainer" class="wali-wrapper">
      <div class="text-center py-4 text-muted">Memuat data...</div>
    </div>

    <div id="bottomCards" class="bottom-grid"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 1. Setup Axios
    const api = axios.create({
      baseURL: 'http://localhost:4000/api',
      headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });

    // Variabel Global Data
    let allTeachers = []; // Semua guru dari DB
    let waliKelasData = []; // Hanya guru yang punya kelas

    // 2. Load Data Awal
    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (user) document.getElementById('username-display').innerText = user.username;

      try {
        // Ambil Data Kelas & Guru secara bersamaan (Parallel Fetching)
        const [kelasRes, guruRes] = await Promise.all([
          api.get('/kelas'),
          api.get('/guru')
        ]);

        // Setup Dropdown Kelas
        populateDropdown('kelasSelect', kelasRes.data, 'nama_kelas', 'nama_kelas');

        // Setup Data Guru
        allTeachers = guruRes.data;

        // Filter: Yang jadi Wali Kelas adalah yang punya kelas (nama_kelas tidak null)
        waliKelasData = allTeachers.filter(g => g.nama_kelas !== null);

        // Setup Dropdown Subject (Unik)
        const uniqueSubjects = [...new Set(waliKelasData.map(item => item.subject))];
        populateDropdownSimple('subjectSelect', uniqueSubjects);

        // Render Tampilan Awal
        renderCards(waliKelasData);

      } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById('waliContainer').innerHTML = `<div class="text-danger">Gagal memuat data server. Pastikan backend menyala.</div>`;
      }
    });

    // 3. Helper: Isi Dropdown dengan Objek
    function populateDropdown(elementId, data, valueKey, textKey) {
      const select = document.getElementById(elementId);
      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item[valueKey];
        opt.textContent = item[textKey];
        select.appendChild(opt);
      });
    }

    // 4. Helper: Isi Dropdown Array Simple
    function populateDropdownSimple(elementId, data) {
      const select = document.getElementById(elementId);
      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    // 5. Fungsi Render Kartu (Inti Tampilan)
    function renderCards(data) {
      const mainContainer = document.getElementById('waliContainer');
      const bottomContainer = document.getElementById('bottomCards');

      mainContainer.innerHTML = '';
      bottomContainer.innerHTML = '';

      if (data.length === 0) {
        mainContainer.innerHTML = `<div style="color:#777; margin:20px 0;">Tidak ada data wali kelas untuk filter tersebut.</div>`;
        return;
      }

      // Logika Layout:
      // Item pertama -> Kartu Besar di Tengah
      const mainItem = data[0];
      const mainCard = createCardHTML(mainItem, false); // false = not small
      mainContainer.appendChild(mainCard);

      // Sisa Item -> Kartu Kecil di Bawah (Maksimal ambil 2-4 lagi biar rapi)
      const restItems = data.slice(1);
      restItems.forEach(item => {
        const smallCard = createCardHTML(item, true); // true = small
        bottomContainer.appendChild(smallCard);
      });
    }

    // 6. Template HTML Kartu
    function createCardHTML(guru, isSmall) {
      const card = document.createElement('div');
      // Tambahkan class .small jika isSmall true
      card.className = isSmall ? 'wali-card small' : 'wali-card';

      card.innerHTML = `
            <div class="photo">
                <i class="bi bi-person-fill" style="font-size: 40px;"></i>
            </div>
            <div class="bio">
                <strong>${guru.nama_guru}</strong>
                <div>NIP: ${guru.nip}</div>
                <div>Mapel: ${guru.subject}</div>
                <div style="margin-top: 5px; color: #00498C; font-weight: bold;">
                    Wali Kelas: ${guru.nama_kelas}
                </div>
            </div>
        `;
      return card;
    }

    // 7. Fungsi Pencarian / Filter
    function handleSearch() {
      const selectedKelas = document.getElementById('kelasSelect').value;
      const selectedSubject = document.getElementById('subjectSelect').value;

      // Filter array waliKelasData
      const filteredData = waliKelasData.filter(guru => {
        const matchKelas = selectedKelas === "" || guru.nama_kelas === selectedKelas;
        const matchSubject = selectedSubject === "" || guru.subject === selectedSubject;
        return matchKelas && matchSubject;
      });

      renderCards(filteredData);
    }

    // 8. Fungsi Logout
    function handleLogout() {
      if (confirm("Yakin ingin logout?")) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
  </script>
</body>

</html>
