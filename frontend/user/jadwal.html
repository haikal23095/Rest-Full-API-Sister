<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SD Permata Indah - Jadwal Pelajaran</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert("Anda belum login!");
            window.location.href = 'login.html';
        }
    </script>

    <style>
        /* STYLE TETAP SAMA SEPERTI SEBELUMNYA */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f7;
        }

        .header-top {
            background-color: #00498C;
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 85px;
        }

        .header-title {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-left: 20px;
            letter-spacing: 1px;
        }

        .menu-bar {
            background-color: #0A64C3;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
        }

        .menu-bar a:hover {
            color: #dfefff;
            text-decoration: underline;
        }

        .menu-right {
            margin-left: auto;
            cursor: pointer;
        }

        .dropdown-menu {
            background-color: #ffffff !important;
        }

        .dropdown-item {
            color: #000 !important;
            font-weight: 600;
        }

        .dropdown-item:hover {
            background-color: #0A64C3 !important;
            color: #fff !important;
        }

        .content {
            padding: 40px 40px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .filter-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .dropdown-custom {
            border-radius: 30px;
            padding: 10px 20px;
            border: 2px solid #000;
            background: white;
            min-width: 220px;
            font-size: 16px;
            font-weight: 600;
        }

        .search-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #000;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background-color: #0A64C3;
            color: white;
            border-color: #0A64C3;
            transform: translateY(-2px);
        }

        .jadwal-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            min-height: 180px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .jadwal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .jadwal-card h5 {
            font-weight: 800;
            margin-bottom: 15px;
            color: #00498C;
            font-size: 20px;
            border-bottom: 2px solid #0A64C3;
            padding-bottom: 8px;
        }

        .jadwal-card p {
            margin: 8px 0;
            font-size: 16px;
            color: #333;
        }

        .time-badge {
            font-size: 12px;
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
            margin-left: 5px;
        }

        .teacher-name {
            font-size: 13px;
            color: #666;
            font-style: italic;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="header-top">
        <img src="logo.png" class="header-logo" onerror="this.style.display='none'">
        <div class="header-title">SD PERMATA INDAH</div>
    </div>

    <div class="menu-bar">
        <a href="beranda.html">BERANDA</a>

        <div class="dropdown d-inline">
            <a class="dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                style="color:white; text-decoration:none;">
                PROFIL
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="profilguru.html">GURU</a></li>
                <li><a class="dropdown-item" href="profilsiswa.html">SISWA</a></li>
            </ul>
        </div>

        <a href="kelas.html">KELAS</a>
        <a href="jadwal.html">JADWAL</a>

        <div class="menu-right dropdown">
            <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown" style="text-decoration: none; color: white;">
                <i class="bi bi-person-circle" style="font-size: 28px;"></i>
                <span id="username-display" style="font-size: 14px; margin-left: 5px;">Hi, User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item text-danger" href="#" onclick="handleLogout()">Logout</a></li>
            </ul>
        </div>
    </div>

    <div class="content">

        <div class="page-title">JADWAL PELAJARAN</div>

        <div class="filter-box">
            <select id="kelasDropdown" class="dropdown-custom">
                <option value="" selected disabled>PILIH KELAS</option>
            </select>

            <button class="search-btn" onclick="renderJadwal()"><i class="bi bi-search"></i></button>
        </div>

        <div class="row g-4" id="jadwal-container">
            <div class="col-12 text-center text-muted py-5">
                <h4>Silakan pilih kelas terlebih dahulu</h4>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Konfigurasi Axios dengan Token
        const api = axios.create({
            baseURL: 'http://localhost:4000/api',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        // Variabel Global untuk menyimpan data mentah
        let allSchedules = [];
        let allClasses = [];

        // 1. Setup Awal (Load User & Data)
        document.addEventListener('DOMContentLoaded', async () => {
            // Tampilkan username
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) document.getElementById('username-display').innerText = user.username;

            // Load Data dari API
            await loadKelas();
            await fetchAllJadwal();
        });

        // 2. Ambil Data Kelas untuk Dropdown
        async function loadKelas() {
            try {
                const response = await api.get('/kelas');
                const classes = response.data;
                const dropdown = document.getElementById('kelasDropdown');

                classes.forEach(cls => {
                    const option = document.createElement('option');
                    option.value = cls.kelas_id;
                    option.textContent = `${cls.nama_kelas} (Grade ${cls.grade_level})`;
                    dropdown.appendChild(option);
                });
            } catch (error) {
                console.error("Gagal ambil kelas:", error);
                alert("Gagal memuat daftar kelas.");
            }
        }

        // 3. Ambil SEMUA Jadwal (Disimpan dulu di memori)
        async function fetchAllJadwal() {
            try {
                const response = await api.get('/jadwal');
                allSchedules = response.data;
            } catch (error) {
                console.error("Gagal ambil jadwal:", error);
            }
        }

        // 4. Fungsi Render Jadwal (Dipanggil saat tombol Search diklik)
        function renderJadwal() {
            const selectedKelasId = document.getElementById('kelasDropdown').value;
            const container = document.getElementById('jadwal-container');

            if (!selectedKelasId) {
                alert("Pilih kelas dulu!");
                return;
            }

            // Filter jadwal hanya untuk kelas yang dipilih
            // (Karena API kita get all, kita filter di sisi frontend)
            const filteredJadwal = allSchedules.filter(item => item.kelas_id == selectedKelasId);

            if (filteredJadwal.length === 0) {
                container.innerHTML = `<div class="col-12 text-center py-5"><h5>Belum ada jadwal untuk kelas ini.</h5></div>`;
                return;
            }

            // Daftar hari kerja
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
            let htmlContent = '';

            days.forEach(day => {
                // Cari jadwal untuk hari tersebut
                // Dan urutkan berdasarkan waktu
                const todaysSchedule = filteredJadwal
                    .filter(item => item.hari === day)
                    .sort((a, b) => a.waktu.localeCompare(b.waktu));

                // Buat Kartu HTML
                htmlContent += `
                    <div class="col-md-4">
                        <div class="jadwal-card">
                            <h5>${day}</h5>
                            ${todaysSchedule.length > 0 ?
                        todaysSchedule.map(sch => `
                                    <div class="mb-2 border-bottom pb-1">
                                        <strong>${sch.subject || sch.nama_guru}</strong>
                                        <span class="time-badge">${sch.waktu.slice(0, 5)}</span>
                                        <span class="teacher-name">Pengajar: ${sch.nama_guru}</span>
                                    </div>
                                `).join('')
                        : '<p class="text-muted">Tidak ada pelajaran</p>'
                    }
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // 5. Fungsi Logout
        function handleLogout() {
            if (confirm("Yakin ingin logout?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }
    </script>

</body>

</html>
