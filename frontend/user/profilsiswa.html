<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Permata Indah - Daftar Siswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert("Anda belum login!");
            window.location.href = 'login.html';
        }
    </script>

    <style>
        /* STYLE TETAP SAMA */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f7;
        }

        .header-top {
            background-color: #00498C;
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 85px;
        }

        .header-title {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-left: 20px;
            letter-spacing: 1px;
        }

        .menu-bar {
            background-color: #0A64C3;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
        }

        .menu-bar a:hover {
            color: #dfefff;
            text-decoration: underline;
        }

        .menu-right {
            margin-left: auto;
            cursor: pointer;
        }

        .dropdown-menu {
            background-color: #ffffff !important;
        }

        .dropdown-item {
            color: #000 !important;
            font-weight: 600;
        }

        .dropdown-item:hover {
            background-color: #0A64C3 !important;
            color: #fff !important;
        }

        .content {
            padding: 40px 40px;
        }

        .title-page {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-box {
            flex: 1;
            height: 50px;
            border-radius: 30px;
            padding: 0 25px;
            border: 2px solid #000;
            font-size: 16px;
            font-weight: 600;
        }

        .search-box:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(10, 100, 195, 0.2);
            border-color: #0A64C3;
        }

        .search-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #000;
            border-radius: 50%;
            font-size: 20px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background-color: #0A64C3;
            color: white;
            border-color: #0A64C3;
            transform: translateY(-2px);
        }

        .student-card {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        /* Ubah warna border foto jadi oranye/beda dikit biar beda sama guru */
        .photo-box {
            width: 80px;
            height: 100px;
            border: 2px solid #ff9800;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
            border-radius: 10px;
            background-color: #fff8e1;
            font-weight: 600;
            color: #ff9800;
            font-size: 40px;
        }

        .info-text {
            font-size: 16px;
            line-height: 28px;
            color: #333;
        }

        .info-text strong {
            color: #00498C;
            font-weight: 600;
            display: inline-block;
            width: 80px;
        }
    </style>
</head>

<body>

    <div class="header-top">
        <img src="logo.png" class="header-logo" alt="Logo" onerror="this.style.display='none'">
        <div class="header-title">SD PERMATA INDAH</div>
    </div>

    <div class="menu-bar">
        <a href="beranda.html">BERANDA</a>

        <div class="dropdown d-inline">
            <a class="dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                style="color:white; text-decoration:none;">
                PROFIL
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="profilguru.html">GURU</a></li>
                <li><a class="dropdown-item" href="profilsiswa.html">SISWA</a></li>
            </ul>
        </div>

        <a href="kelas.html">KELAS</a>
        <a href="jadwal.html">JADWAL</a>

        <div class="menu-right dropdown">
            <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown" style="text-decoration: none; color: white;">
                <i class="bi bi-person-circle" style="font-size: 28px;"></i>
                <span id="username-display" style="font-size: 14px; margin-left: 5px;">Hi, User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item text-danger" href="#" onclick="handleLogout()">Logout</a></li>
            </ul>
        </div>
    </div>

    <div class="content">

        <div class="title-page">DAFTAR SISWA</div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="CARI NAMA ATAU NIS...">
            <button class="search-btn" onclick="handleSearch()"><i class="bi bi-search"></i></button>
        </div>

        <div class="row" id="siswa-container">
            <div class="col-12 text-center py-5">Memuat Data Siswa...</div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Setup Axios
        const api = axios.create({
            baseURL: 'http://localhost:4000/api',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        // Variabel Global
        let allSiswa = [];

        // 2. Load Data
        document.addEventListener('DOMContentLoaded', async () => {
            // Set Username
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) document.getElementById('username-display').innerText = user.username;

            // Fetch Siswa
            await loadDataSiswa();
        });

        // 3. Fungsi Fetch
        async function loadDataSiswa() {
            try {
                // Endpoint kita adalah /api/murid
                const response = await api.get('/murid');
                allSiswa = response.data;
                renderSiswa(allSiswa);
            } catch (error) {
                console.error(error);
                document.getElementById('siswa-container').innerHTML =
                    `<div class="col-12 text-danger text-center">Gagal memuat data siswa.</div>`;
            }
        }

        // 4. Fungsi Render
        function renderSiswa(data) {
            const container = document.getElementById('siswa-container');

            if (data.length === 0) {
                container.innerHTML = `<div class="col-12 text-muted text-center py-5">Data siswa tidak ditemukan.</div>`;
                return;
            }

            let html = '';
            data.forEach(siswa => {
                // Data dari DB: murid_id, nama_murid, nis, alamat, nama_kelas (dari join)

                // Handle jika siswa belum masuk kelas
                const kelasDisplay = siswa.nama_kelas
                    ? `<span class="badge bg-success">${siswa.nama_kelas}</span>`
                    : `<span class="badge bg-secondary">Belum ada kelas</span>`;

                html += `
                <div class="col-md-6">
                    <div class="student-card">
                        <div class="photo-box">
                            <i class="bi bi-backpack-fill"></i>
                        </div>
                        <div class="info-text">
                            <div><strong>Nama</strong> : ${siswa.nama_murid}</div>
                            <div><strong>NIS</strong> : ${siswa.nis}</div>
                            <div><strong>Kelas</strong> : ${kelasDisplay}</div>
                            <div><strong>Alamat</strong> : ${siswa.alamat || '-'}</div>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // 5. Fungsi Search
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allSiswa.filter(siswa =>
                siswa.nama_murid.toLowerCase().includes(keyword) ||
                siswa.nis.includes(keyword)
            );

            renderSiswa(filtered);
        }

        // Search pakai Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // 6. Logout
        function handleLogout() {
            if (confirm("Yakin ingin logout?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>

</html>
