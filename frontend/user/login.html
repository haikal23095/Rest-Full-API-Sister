<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Permata Indah - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        /* HEADER ATAS */
        .header-top {
            background-color: #00498C;
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 85px;
        }

        .header-title {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-left: 20px;
            letter-spacing: 1px;
        }

        /* MENU */
        .menu-bar {
            background-color: #0A64C3;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 600;
        }

        .menu-bar a {
            color: white;
            margin-right: 25px;
            text-decoration: none;
        }

        .menu-bar img {
            width: 38px;
        }

        /* DROPDOWN STYLING */
        .dropdown-menu {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .dropdown-item {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .dropdown-item:hover {
            background-color: #0A64C3;
            color: white;
        }

        .dropdown-toggle::after {
            margin-left: 6px;
            vertical-align: middle;
        }

        /* LOGIN BOX */
        .login-container {
            width: 420px;
            border: 1px solid #bfbfbf;
            padding: 40px;
            margin: 80px auto;
            background-color: white;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-control {
            height: 48px;
            border-radius: 30px;
        }

        .btn-login {
            height: 48px;
            width: 100%;
            background-color: #0A64C3;
            border-radius: 25px;
            font-weight: 700;
            font-size: 20px;
            color: white;
            border: none;
        }

        .actions {
            margin-top: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .actions a {
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- HEADER UTAMA -->
    <div class="header-top d-flex align-items-center">
        <img src="logo.png" class="header-logo" alt="Logo" onerror="this.style.display='none'">
        <div class="header-title">SD PERMATA INDAH</div>
    </div>

    <!-- LOGIN BOX -->
    <div class="login-container">
        <div class="login-title">LOGIN</div>

        <input type="text" class="form-control mb-3" placeholder="EMAIL OR USERNAME">
        <input type="password" class="form-control mb-3" placeholder="PASSWORD">

        <button class="btn-login" onclick="handleLogin()">LOGIN</button>

        <div class="actions">
            <a href="#">LUPA PASSWORD?</a> &nbsp;&nbsp; <a href="register.html">DAFTAR AKUN</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function handleLogin() {
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            // Validasi Input Kosong
            if (!usernameInput || !passwordInput) {
                alert("Harap isi Username dan Password!");
                return;
            }

            try {
                // 1. Kirim Request ke Backend
                // Pastikan backend jalan di port 4000
                const response = await axios.post('http://localhost:4000/auth/login', {
                    username: usernameInput,
                    password: passwordInput
                });

                // 2. Jika Sukses (Kode 200)
                const { token, user, message } = response.data;

                // Simpan Token & Info User ke LocalStorage (Memori Browser)
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));

                alert("Login Berhasil! Selamat datang " + user.username);

                // 3. Redirect ke Halaman Beranda
                window.location.href = 'beranda.html';

            } catch (error) {
                console.error(error);
                // 4. Handle Error (Password Salah / User tidak ada)
                if (error.response) {
                    alert("Gagal: " + error.response.data.message);
                } else {
                    alert("Gagal terhubung ke server. Pastikan Docker backend menyala!");
                }
            }
        }
    </script>
</body>

</html>
