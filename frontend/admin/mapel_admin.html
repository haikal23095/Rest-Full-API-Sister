<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin | Jadwal Pelajaran per Kelas</title>

    <style>
        body {
            background: #ffffff;
        }

        .btn-tambah {
            background-color: #d1d1d1;
            padding: 6px 20px;
            border-radius: 8px;
            color: #333;
            font-weight: 600;
        }

        .btn-hapus {
            background-color: #cb2222ff;
            padding: 6px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
        }

        .table thead th {
            background-color: #10159eff;
            color: white;
            text-align: center;
        }

        .kelas-title {
            background: #10159eff;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h3 class="fw-bold mb-4">Jadwal Pelajaran</h3>

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <button class="btn btn-tambah me-2" id="btnTambah">Tambah</button>
                <button class="btn btn-hapus" id="btnHapus">Hapus</button>
            </div>

            <div class="d-flex gap-3">
                <!-- FILTER KELAS -->
                <select id="filterKelas" class="form-select" style="width: 160px;">
                    <option value="">Semua Kelas</option>
                    <option value="1A">Kelas 1A</option>
                    <option value="1B">Kelas 1B</option>
                    <option value="2A">Kelas 2A</option>
                    <option value="2B">Kelas 2B</option>
                </select>

                <!-- FILTER HARI (BARU DITAMBAHKAN) -->
                <select id="filterHari" class="form-select" style="width: 160px;">
                    <option value="">Semua Hari</option>
                    <option value="Senin">Senin</option>
                    <option value="Selasa">Selasa</option>
                    <option value="Rabu">Rabu</option>
                    <option value="Kamis">Kamis</option>
                    <option value="Jumat">Jumat</option>
                </select>

                <!-- SEARCH -->
                <input type="text" id="searchBox" class="form-control" placeholder="Search">
            </div>
        </div>


        <!-- ============================== -->
        <!-- KELAS 1A -->
        <!-- ============================== -->
        <h5 class="kelas-title">KELAS 1A</h5>

        <table class="table table-bordered kelas-table" data-kelas="1A">
            <thead>
                <tr>
                    <th width="50"><input type="checkbox" class="checkAll"></th>
                    <th>No</th>
                    <th>Hari</th>
                    <th>Mapel</th>
                    <th>Jam</th>
                    <th>Guru</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td class="text-center"><input type="checkbox" class="row-check"></td>
                    <td>1</td>
                    <td>Senin</td>
                    <td>Matematika</td>
                    <td>07.00 - 08.40</td>
                    <td>Ibu Siti</td>
                </tr>
            </tbody>
        </table>


        <!-- ============================== -->
        <!-- KELAS 1B -->
        <!-- ============================== -->
        <h5 class="kelas-title">KELAS 1B</h5>

        <table class="table table-bordered kelas-table" data-kelas="1B">
            <thead>
                <tr>
                    <th width="50"><input type="checkbox" class="checkAll"></th>
                    <th>No</th>
                    <th>Hari</th>
                    <th>Mapel</th>
                    <th>Jam</th>
                    <th>Guru</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td class="text-center"><input type="checkbox" class="row-check"></td>
                    <td>1</td>
                    <td>Selasa</td>
                    <td>Bahasa Indonesia</td>
                    <td>09.00 - 10.40</td>
                    <td>Pak Budi</td>
                </tr>
            </tbody>
        </table>

    </div>


    <script>

        // ======================================================
        // FILTER KELAS
        // ======================================================
        document.getElementById("filterKelas").addEventListener("change", function () {
            let val = this.value;
            let tables = document.querySelectorAll(".kelas-table");
            let titles = document.querySelectorAll(".kelas-title");

            tables.forEach((tb, i) => {
                if (val === "" || tb.dataset.kelas === val) {
                    tb.style.display = "";
                    titles[i].style.display = "";
                } else {
                    tb.style.display = "none";
                    titles[i].style.display = "none";
                }
            });
        });


        // ======================================================
        // FILTER HARI (BARU)
        // ======================================================
        document.getElementById("filterHari").addEventListener("change", function () {
            let hariVal = this.value.toLowerCase();
            let rows = document.querySelectorAll("tbody tr");

            rows.forEach(row => {
                let rowHari = row.children[2].innerText.toLowerCase();

                if (hariVal === "" || rowHari === hariVal) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        });


        // ======================================================
        // SEARCH GLOBAL
        // ======================================================
        document.getElementById("searchBox").addEventListener("keyup", function () {
            let val = this.value.toLowerCase();
            let rows = document.querySelectorAll("tbody tr");

            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
            });
        });


        // ======================================================
        // TAMBAH JADWAL (SWEETALERT)
        // ======================================================
        document.getElementById("btnTambah").addEventListener("click", async function () {

            const { value: data } = await Swal.fire({
                title: "Tambah Jadwal Kelas",
                width: 450,
                html: `
                    <div style="text-align:left">

                        <label class="swal2-label">Kelas</label>
                        <select id="kelas" class="swal2-input" 
                                style="width:100%;height:40px;margin-bottom:12px;">
                            <option value="">Pilih Kelas</option>
                            <option value="1A">Kelas 1A</option>
                            <option value="1B">Kelas 1B</option>
                            <option value="2A">Kelas 2A</option>
                            <option value="2B">Kelas 2B</option>
                        </select>

                        <label class="swal2-label">Hari</label>
                        <select id="hari" class="swal2-input"
                                style="width:100%;height:40px;margin-bottom:12px;">
                            <option>Senin</option>
                            <option>Selasa</option>
                            <option>Rabu</option>
                            <option>Kamis</option>
                            <option>Jumat</option>
                        </select>

                        <label class="swal2-label">Mata Pelajaran</label>
                        <input id="mapel" class="swal2-input" placeholder="Contoh: Matematika"
                               style="width:100%;margin-bottom:12px;">

                        <label class="swal2-label">Jam Pelajaran</label>
                        <input id="jam" class="swal2-input" placeholder="07.00 - 08.40"
                               style="width:100%;margin-bottom:12px;">

                        <label class="swal2-label">Guru Pengajar</label>
                        <input id="guru" class="swal2-input" placeholder="Contoh: Ibu Siti"
                               style="width:100%;margin-bottom:12px;">
                    </div>
                `,
                confirmButtonText: "Tambah",
                preConfirm: () => {
                    let kelas = document.getElementById("kelas").value.trim();
                    let hari = document.getElementById("hari").value.trim();
                    let mapel = document.getElementById("mapel").value.trim();
                    let jam = document.getElementById("jam").value.trim();
                    let guru = document.getElementById("guru").value.trim();

                    if (!kelas || !hari || !mapel || !jam || !guru) {
                        Swal.showValidationMessage("Semua form wajib diisi!");
                        return false;
                    }

                    return { kelas, hari, mapel, jam, guru };
                }
            });

            if (data) {
                const table = document.querySelector(`table[data-kelas="${data.kelas}"] tbody`);

                const newRow = `
                    <tr>
                        <td class="text-center"><input type="checkbox" class="row-check"></td>
                        <td>${table.rows.length + 1}</td>
                        <td>${data.hari}</td>
                        <td>${data.mapel}</td>
                        <td>${data.jam}</td>
                        <td>${data.guru}</td>
                    </tr>
                `;

                table.insertAdjacentHTML("beforeend", newRow);

                Swal.fire({
                    icon: "success",
                    title: "Berhasil!",
                    text: "Jadwal baru ditambahkan.",
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        });


        // ======================================================
        // HAPUS DATA
        // ======================================================
        document.getElementById("btnHapus").addEventListener("click", function () {

            const checkedRows = document.querySelectorAll(".row-check:checked");

            if (checkedRows.length === 0) {
                Swal.fire({
                    icon: "warning",
                    title: "Tidak ada data!",
                    text: "Pilih minimal satu jadwal."
                });
                return;
            }

            Swal.fire({
                title: "Hapus data?",
                text: `${checkedRows.length} jadwal akan dihapus.`,
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                confirmButtonText: "Hapus"
            }).then(result => {
                if (result.isConfirmed) {

                    checkedRows.forEach(chk => chk.closest("tr").remove());

                    // Perbaiki nomor
                    document.querySelectorAll(".kelas-table").forEach(table => {
                        const rows = table.querySelectorAll("tbody tr");
                        let n = 1;
                        rows.forEach(r => r.children[1].innerText = n++);
                    });

                    Swal.fire({
                        icon: "success",
                        title: "Data terhapus!",
                        timer: 1200,
                        showConfirmButton: false
                    });
                }
            });
        });

    </script>

</body>

</html>
